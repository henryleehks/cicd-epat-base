name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-test:

    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 23
      uses: actions/setup-java@v4
      with:
        java-version: '23'
        distribution: 'temurin'
        cache: maven
    - name: Unit Testing with Maven
      run: mvn test

  snyk-security-scan:
    needs: build-test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 23
      uses: actions/setup-java@v4
      with:
        java-version: '23'
        distribution: 'temurin'
        cache: maven
    - name: Set up Snyk CLI
      uses: snyk/actions/setup@master
    - name: Scan dependencies with Snyk
      run: snyk test --severity-threshold=high
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  telegram-notify:
    needs: [build-test, snyk-security-scan]
    if: always()
    runs-on: ubuntu-latest
    steps:
    - name: Send Telegram notification
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        REPO: ${{ github.repository }}
        BRANCH: ${{ github.ref_name }}
        ACTOR: ${{ github.actor }}
        SHA: ${{ github.sha }}
        BUILD_RESULT: ${{ needs.build-test.result }}
        SNYK_RESULT: ${{ needs.snyk-security-scan.result }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        MESSAGE="CI pipeline finished for ${REPO}
        Branch: ${BRANCH}
        Commit: ${SHA:0:7} by ${ACTOR}
        Build & test: ${BUILD_RESULT}
        Snyk security scan: ${SNYK_RESULT}
        Details: ${RUN_URL}"
        curl -sS --fail -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
          --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
          --data-urlencode "text=${MESSAGE}" > /dev/null
